[package]
name = "mentis-record"
version = "0.1.0"
description = "The Brain, read only: opening, locks, read scopes, position, chain verification"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Row H's way to the front's own reader, for test builds only (src/probe.rs). Nothing turns this on by default.
row-h-probe = []
# The statement trace, for test builds only (src/trace.rs). Nothing turns this on by default.
sql-trace = []

[dependencies]
rusqlite = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

