[package]
name = "mentis-server"
version = "0.1.0"
description = "The Rust front: owns the public port, serves what it owns, forwards everything else to Python"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "mentis-server"
path = "src/main.rs"

[[bin]]
name = "mentis-launch"
path = "src/bin/mentis-launch.rs"

[dependencies]
mentis-ops = { workspace = true }
mentis-record = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
