# The Rust side of Mentis during the migration (docs/rust/README.md).
# Nothing here writes a Brain until the release that says so (docs/rust/contracts/record.md).
[workspace]
resolver = "3"
members = [
    "crates/mentis-server",
    "crates/mentis-ops",
    "crates/mentis-rules",
    "crates/mentis-record",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# Exact pins, as in MARS. Licences: MIT / Apache-2.0 / BSD only (deny.toml).
# Where MARS uses the same crate, the same version.
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
libc = "=0.2.191"
windows-sys = "=0.61.2"
# SQLite is bundled and pinned so the front's library is known; only mentis-record may depend on it.
# hooks: the progress handler that ends a read scope. trace: statement counts in test builds.
rusqlite = { version = "=0.41.1", features = ["bundled", "hooks", "trace"] }
sha2 = "=0.11.1"

mentis-record = { path = "crates/mentis-record" }
mentis-rules = { path = "crates/mentis-rules" }
mentis-ops = { path = "crates/mentis-ops" }
