<!doctype html><html data-theme="dark"><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
/* THE PAGE THE CARD IS PHOTOGRAPHED ON, and nothing more.
   The Magnet card's design language hard-codes dark-card inks
   (`magnets/design.css`: #eee8e5 headings on the mockups' dark panel), so the
   page is dark and the theme tokens are told so -- otherwise `var(--text)`,
   which `q2-prose` and its tables read, resolves light and the prose renders
   near-invisible on the card. `.q2-magnet-card` is `position:absolute` inside
   the app's floating panel; this stands it in the page instead. Nothing here
   styles the surface under test. */
body{margin:0;background:#2a2322;color:#eee8e5;font:14px/1.5 system-ui,sans-serif}
.q2 .q2-magnet-card{position:static;overflow:visible;max-width:820px;margin:0 auto;background:#2b2423}
.q2 .q2-magnet-card>header{padding:18px 28px 0}
.q2 .q2-magnet-card>header h2{font:600 18px/1.3 system-ui,sans-serif}
</style></head><body><div id="root"></div><script type="module" src="/tests/quiet_magnet_part5_harness.tsx"></script></body></html>
